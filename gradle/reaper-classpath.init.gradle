// Reaper: print resolved compile/runtime classpath JARs, project output dirs, and source roots.
// stdout: JAR:/path  SOURCES:/path  CLASSES:/path  SRCROOT:/path
allprojects { project ->
    project.tasks.register('reaperPrintClasspath') {
        group = 'reaper'
        description = 'Print classpath and source JARs for Reaper IDE indexing'
        // Main compile only — builds inter-module outputs. Test deps resolve via
        // testCompileClasspath below without compiling test sources (much faster).
        // Set -PreaperClasspathIncludeTestCompile=true (REAPER_CLASSPATH_FULL=1) to compile tests too.
        def skipCompile = project.findProperty('reaperClasspathSkipCompile') == 'true'
        def includeTestCompile = project.findProperty('reaperClasspathIncludeTestCompile') == 'true'
        if (!skipCompile) {
            def compileJava = project.tasks.findByName('compileJava')
            if (compileJava != null) {
                dependsOn compileJava
            }
        }
        if (includeTestCompile) {
            def compileTestJava = project.tasks.findByName('compileTestJava')
            if (compileTestJava != null) {
                dependsOn compileTestJava
            }
        }
        doLast {
            def names = [
                'compileClasspath',
                'runtimeClasspath',
                'testCompileClasspath',
                'testRuntimeClasspath',
                'annotationProcessor',
            ]
            def seenJars = new LinkedHashSet<String>()
            def seenSources = new LinkedHashSet<String>()
            def seenClasses = new LinkedHashSet<String>()
            def seenSrcRoots = new LinkedHashSet<String>()

            for (name in names) {
                def conf = project.configurations.findByName(name)
                if (conf == null || !conf.canBeResolved) {
                    continue
                }

                conf.files.each { f ->
                    if (f.name.endsWith('.jar') && seenJars.add(f.absolutePath)) {
                        println 'JAR:' + f.absolutePath
                    }
                    if (!f.name.endsWith('.jar')) {
                        return
                    }
                    def base = f.name.substring(0, f.name.length() - 4)
                    def sibling = new File(f.parentFile, base + '-sources.jar')
                    if (sibling.isFile() && seenSources.add(sibling.absolutePath)) {
                        println 'SOURCES:' + sibling.absolutePath
                    } else if (f.parentFile?.parentFile?.isDirectory()) {
                        f.parentFile.parentFile.eachDir { versionDir ->
                            versionDir.eachFile { vf ->
                                if (vf.isFile() && vf.name == base + '-sources.jar' && seenSources.add(vf.absolutePath)) {
                                    println 'SOURCES:' + vf.absolutePath
                                }
                            }
                        }
                    }
                }

                try {
                    conf.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def file = artifact.file
                        if (file == null || !file.name.endsWith('.jar')) {
                            return
                        }
                        def id = artifact.moduleVersion.id
                        try {
                            def dep = project.dependencies.create([
                                group: id.group,
                                name: id.name,
                                version: id.version,
                                classifier: 'sources',
                                ext: 'jar',
                            ])
                            def srcConf = project.configurations.detachedConfiguration(dep)
                            srcConf.transitive = false
                            srcConf.resolve().each { srcFile ->
                                if (srcFile.isFile() && seenSources.add(srcFile.absolutePath)) {
                                    println 'SOURCES:' + srcFile.absolutePath
                                }
                            }
                        } catch (Exception ignored) {
                            // Module may not publish a sources artifact.
                        }
                    }
                } catch (Exception ignored) {
                    // Resolution metadata unavailable for this configuration.
                }
            }

            project.sourceSets.all { sourceSet ->
                sourceSet.java.srcDirs.each { dir ->
                    if (dir.isDirectory() && seenSrcRoots.add(dir.absolutePath)) {
                        println 'SRCROOT:' + dir.absolutePath
                    }
                }
                try {
                    sourceSet.output.generatedSourcesDirs.files.each { dir ->
                        if (dir.isDirectory() && seenSrcRoots.add(dir.absolutePath)) {
                            println 'SRCROOT:' + dir.absolutePath
                        }
                    }
                } catch (Exception ignored) {
                    // Older Gradle API without generatedSourcesDirs.
                }
                sourceSet.output.classesDirs.files.each { dir ->
                    if (dir.isDirectory() && seenClasses.add(dir.absolutePath)) {
                        println 'CLASSES:' + dir.absolutePath
                    }
                }
            }
        }
    }
}
